<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff066"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#06080d"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <style>
    @keyframes cursorBlink {
      0%, 49% { opacity: 1; stroke: #22c55e; }
      50%, 100% { opacity: 0; }
    }
    @keyframes borderGlow {
      0%, 100% { stroke: #ffd700; stroke-opacity: 0.9; }
      50% { stroke: #38bdf8; stroke-opacity: 0.4; }
    }
    .cursor-line {
      animation: cursorBlink 0.8s infinite;
    }
    .border-rect {
      animation: borderGlow 2.5s infinite ease-in-out;
    }
  </style>
  <!-- Background rounded tile -->
  <rect class="border-rect" x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#ffd700" stroke-width="2.5"/>
  <!-- Terminal prompt > -->
  <path d="M 17 21 L 29 32 L 17 43" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Glowing animated prompt cursor _ -->
  <line class="cursor-line" x1="34" y1="43" x2="47" y2="43" stroke="#22c55e" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)"/>
</svg>
