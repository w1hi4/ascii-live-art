<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRT Terminal Player - ASCII.LIVE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #030407;
      color: #fff;
      font-family: 'JetBrains Mono', Consolas, monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Top Action Bar */
    .action-bar {
      position: fixed;
      top: 1rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      background: rgba(18, 19, 28, 0.85);
      border: 1px solid rgba(255, 215, 0, 0.3);
      backdrop-filter: blur(12px);
      padding: 0.6rem 1.25rem;
      border-radius: 8px;
      z-index: 50;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }

    .cmd-box {
      font-size: 0.85rem;
      color: #ffd700;
      user-select: all;
    }

    .btn-action {
      background: rgba(255, 215, 0, 0.15);
      border: 1px solid rgba(255, 215, 0, 0.4);
      color: #ffd700;
      padding: 0.35rem 0.75rem;
      border-radius: 4px;
      font-family: inherit;
      font-size: 0.75rem;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
    }

    .btn-action:hover {
      background: #ffd700;
      color: #000;
      font-weight: bold;
    }

    /* CRT Monitor Casing */
    .crt-monitor {
      background: #14161f;
      border: 4px solid #232736;
      border-radius: 24px;
      padding: 2rem;
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.9), inset 0 0 20px rgba(0, 0, 0, 0.8);
      max-width: 95vw;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Curved CRT Glass */
    .crt-screen {
      background: #000;
      border-radius: 12px;
      padding: 1.5rem;
      overflow: auto;
      font-size: 11px;
      line-height: 1.05;
      white-space: pre;
      position: relative;
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.95);
    }

    /* Scanlines */
    .scanlines::after {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      background-size: 100% 3px, 6px 100%;
      pointer-events: none;
    }

    /* CRT Phosphor Glow */
    .crt-glow {
      text-shadow: 0 0 4px rgba(255, 215, 0, 0.4);
    }

    /* Bottom Control Bar */
    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
      padding: 0 0.5rem;
      font-size: 0.75rem;
      color: #94a3b8;
    }

    .badge-status {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: #27c93f;
      font-weight: bold;
    }

    .badge-status::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #27c93f;
      box-shadow: 0 0 8px #27c93f;
    }
  </style>
</head>
<body>

  <!-- Top Action Bar -->
  <div class="action-bar">
    <a href="/" class="btn-action">← Studio</a>
    <div class="cmd-box" id="curlCmd">curl -s http://localhost:8080/ciarl</div>
    <button class="btn-action" onclick="copyCurl()">📋 Copy curl</button>
    <button class="btn-action" id="btnPause" onclick="togglePlay()">⏸️ Pause</button>
    <button class="btn-action" onclick="toggleScanlines()">📺 Scanlines</button>
  </div>

  <!-- CRT Monitor Frame -->
  <div class="crt-monitor">
    <div id="crtDisplay" class="crt-screen scanlines crt-glow">
      <!-- ANSI Frame Content Rendered Here -->
    </div>
    <div class="bottom-bar">
      <div class="badge-status">STREAM ACTIVE</div>
      <div id="frameMeta">Loading frames...</div>
    </div>
  </div>

  <script src="/static/app.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const slug = urlParams.get('slug') || 'ciarl';
    const display = document.getElementById('crtDisplay');
    const curlCmd = document.getElementById('curlCmd');
    const frameMeta = document.getElementById('frameMeta');
    const btnPause = document.getElementById('btnPause');

    let viewerFrames = [];
    let viewerFps = 12;
    let viewerIdx = 0;
    let viewerTimer = null;
    let isPlaying = true;

    async function initViewer() {
      curlCmd.textContent = `curl -s http://${window.location.host}/${slug}`;
      try {
        const res = await fetch(`/api/animation/${slug}`);
        if (!res.ok) {
          display.textContent = `Animation '${slug}' not found.`;
          return;
        }
        const data = await res.json();
        viewerFrames = data.frames || [];
        viewerFps = data.fps || 12;
        frameMeta.textContent = `${data.title} • ${data.width} cols • ${viewerFps} FPS`;

        startViewerLoop();
      } catch (e) {
        display.textContent = `Error loading animation: ${e.message}`;
      }
    }

    function startViewerLoop() {
      if (viewerTimer) clearInterval(viewerTimer);
      if (!viewerFrames || viewerFrames.length === 0) return;
      
      const delay = Math.max(20, Math.floor(1000 / viewerFps));
      viewerTimer = setInterval(() => {
        display.innerHTML = ansiToHtml(viewerFrames[viewerIdx]);
        viewerIdx = (viewerIdx + 1) % viewerFrames.length;
      }, delay);
    }

    function togglePlay() {
      if (isPlaying) {
        clearInterval(viewerTimer);
        btnPause.textContent = "▶️ Play";
        isPlaying = false;
      } else {
        startViewerLoop();
        btnPause.textContent = "⏸️ Pause";
        isPlaying = true;
      }
    }

    function toggleScanlines() {
      display.classList.toggle('scanlines');
    }

    function copyCurl() {
      copyText(curlCmd.textContent);
    }

    window.addEventListener('DOMContentLoaded', initViewer);
  </script>
</body>
</html>
