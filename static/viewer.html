<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>CRT Terminal Player - ASCII Live Art</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #ffd700;
      --gold-glow: rgba(255, 215, 0, 0.4);
      --green: #22c55e;
      --bg: #030407;
      --panel: #0d1017;
      --border: rgba(255, 215, 0, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: #fff;
      font-family: 'JetBrains Mono', Consolas, monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 1rem 0.75rem;
    }

    /* Floating Toast */
    .toast {
      position: fixed;
      top: 16px;
      right: 16px;
      background: #1e2230;
      border: 1px solid var(--gold);
      color: #fff;
      padding: 0.6rem 1rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      z-index: 9999;
      opacity: 0;
      transform: translateY(-10px);
      transition: all 0.25s ease;
      pointer-events: none;
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Top Action Bar */
    .action-bar {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      background: rgba(13, 16, 23, 0.9);
      border: 1px solid var(--border);
      backdrop-filter: blur(12px);
      padding: 0.6rem 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }

    .cmd-group {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      overflow-x: auto;
      max-width: 100%;
    }

    .cmd-box {
      font-size: 0.82rem;
      color: var(--gold);
      user-select: all;
      background: #000;
      padding: 0.35rem 0.65rem;
      border-radius: 4px;
      border: 1px solid rgba(255, 215, 0, 0.15);
      white-space: nowrap;
    }

    .btn-group {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .btn-action {
      background: rgba(255, 215, 0, 0.12);
      border: 1px solid var(--border);
      color: var(--gold);
      padding: 0.35rem 0.75rem;
      border-radius: 4px;
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      transition: all 0.2s;
    }

    .btn-action:hover {
      background: var(--gold);
      color: #000;
    }

    /* CRT Monitor Casing */
    .crt-monitor {
      background: #11141c;
      border: 3px solid #1f2430;
      border-radius: 16px;
      padding: 1.25rem;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.9), inset 0 0 20px rgba(0, 0, 0, 0.8);
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Curved CRT Glass */
    .crt-screen {
      background: #000;
      border-radius: 8px;
      padding: 1.25rem;
      overflow: auto;
      font-size: clamp(6.5px, 1.6vw, 12px);
      line-height: 1.05;
      white-space: pre;
      position: relative;
      min-height: 280px;
      max-height: 70vh;
      box-shadow: inset 0 0 35px rgba(0, 0, 0, 0.95);
    }

    /* Scanlines */
    .scanlines::after {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%);
      background-size: 100% 3px;
      pointer-events: none;
    }

    .crt-glow {
      text-shadow: 0 0 4px rgba(255, 215, 0, 0.35);
    }

    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.85rem;
      padding: 0 0.25rem;
      font-size: 0.75rem;
      color: #94a3b8;
    }

    .badge-status {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--green);
      font-weight: 700;
    }

    .badge-status::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
    }

    @media (max-width: 600px) {
      .action-bar {
        flex-direction: column;
        align-items: stretch;
      }
      .btn-group {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
      .btn-action {
        justify-content: center;
        padding: 0.5rem;
      }
      .crt-monitor {
        padding: 0.75rem;
      }
      .crt-screen {
        padding: 0.75rem;
      }
    }
  </style>
</head>
<body>

  <!-- Floating Toast -->
  <div id="toast" class="toast">Copied to clipboard!</div>

  <!-- Top Action Bar -->
  <div class="action-bar">
    <div class="cmd-group">
      <a href="/" class="btn-action">← Home</a>
      <div class="cmd-box" id="curlCmd">Loading command...</div>
    </div>
    <div class="btn-group">
      <button class="btn-action" onclick="copyCurl()">📋 Copy curl</button>
      <button class="btn-action" id="btnPause" onclick="togglePlay()">⏸️ Pause</button>
      <button class="btn-action" onclick="toggleScanlines()">📺 Scanlines</button>
    </div>
  </div>

  <!-- CRT Monitor Frame -->
  <div class="crt-monitor">
    <div id="crtDisplay" class="crt-screen scanlines crt-glow">
      <!-- ANSI Frame Content Rendered Here -->
    </div>
    <div class="bottom-bar">
      <div class="badge-status">STREAM ACTIVE</div>
      <div id="frameMeta">Loading frames...</div>
    </div>
  </div>

  <script src="/static/app.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const slug = urlParams.get('slug') || 'art';
    const display = document.getElementById('crtDisplay');
    const curlCmd = document.getElementById('curlCmd');
    const frameMeta = document.getElementById('frameMeta');
    const btnPause = document.getElementById('btnPause');

    let viewerFrames = [];
    let viewerFps = 14;
    let viewerIdx = 0;
    let viewerTimer = null;
    let isPlaying = true;

    async function initViewer() {
      const proto = window.location.protocol;
      curlCmd.textContent = `curl -s ${proto}//${window.location.host}/${slug}`;
      try {
        const res = await fetch(`/api/animation/${slug}`);
        if (!res.ok) {
          display.textContent = `Animation '${slug}' not found.`;
          return;
        }
        const data = await res.json();
        viewerFrames = data.frames || [];
        viewerFps = data.fps || 14;
        frameMeta.textContent = `${data.title} • ${data.width} cols • ${viewerFps} FPS`;

        startViewerLoop();
      } catch (e) {
        display.textContent = `Error loading animation: ${e.message}`;
      }
    }

    function startViewerLoop() {
      if (viewerTimer) clearInterval(viewerTimer);
      if (!viewerFrames || viewerFrames.length === 0) return;
      
      const delay = Math.max(20, Math.floor(1000 / viewerFps));
      viewerTimer = setInterval(() => {
        display.innerHTML = ansiToHtml(viewerFrames[viewerIdx]);
        viewerIdx = (viewerIdx + 1) % viewerFrames.length;
      }, delay);
    }

    function togglePlay() {
      if (isPlaying) {
        clearInterval(viewerTimer);
        btnPause.textContent = "▶️ Play";
        isPlaying = false;
      } else {
        startViewerLoop();
        btnPause.textContent = "⏸️ Pause";
        isPlaying = true;
      }
    }

    function toggleScanlines() {
      display.classList.toggle('scanlines');
    }

    function copyCurl() {
      copyText(curlCmd.textContent);
    }

    window.addEventListener('DOMContentLoaded', initViewer);
  </script>
</body>
</html>
