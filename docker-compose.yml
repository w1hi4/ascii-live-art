services:
  ascii-live:
    build: .
    image: ascii-live-pro:latest
    container_name: ascii-live-app
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      - PORT=8080
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, os; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

